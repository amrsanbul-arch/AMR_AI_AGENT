[project]
name = "amr-ai-instagram-manager"
version = "0.4.0"
description = "AMR AI content assistant and official Instagram OAuth scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "cryptography>=42,<46",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["api/tests"]
